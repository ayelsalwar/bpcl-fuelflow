syntax = "proto3";

package auth;
option go_package = "proto/authpb";

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
}

message RegisterRequest {
    string name = 1;
    string email = 2;
    string password = 3;
    string role = 4;  
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message AuthResponse {
    int32 status = 1;
    string message = 2;
    string token = 3;
}
